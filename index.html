<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>First Lease — App Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b900:#0a2257;--b800:#0f3b8c;--b700:#1d4ed8;--b600:#2563eb;--b500:#3b82f6;--b300:#93c5fd;--b200:#bfdbfe;--b100:#dbeafe;--b50:#eff6ff;
--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fd;--ok:#059669;--okbg:#ecfdf5;--warn:#c2410c;--warnbg:#fff7ed;--bad:#dc2626;--badbg:#fef2f2;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#dbe7fb,#eef3fc 40%,#e3ecfb);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(15,59,140,.12)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:6}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--b900)}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--b500),var(--b800));display:grid;place-items:center}
.hdr-r{display:flex;align-items:center;gap:8px}
.icon-btn{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:var(--b50);color:var(--b800);font-weight:700;font-size:12.5px;border:1px solid var(--b100)}
.me-btn{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--b200);padding:0}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--b600)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.seg{display:flex;background:#e6edf9;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--b800)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(15,59,140,.15);color:var(--b600)}

/* filter bar + dropdowns */
.fbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fbar::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:10px;background:#fff;border:1px solid #cbd5e1;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.fbtn svg{width:12px;height:12px;opacity:.7}
.fbtn.active{background:var(--b50);border-color:var(--b500);color:var(--b700)}
.fbtn.open{background:var(--b600);border-color:var(--b600);color:#fff}
.fshade{position:absolute;inset:0;z-index:15;background:rgba(8,20,50,.18);display:none}
.fshade.on{display:block}
.fpanel{position:absolute;left:10px;right:10px;z-index:16;background:#fff;border-radius:16px;box-shadow:0 16px 40px rgba(10,34,87,.25);display:none;flex-direction:column;max-height:62%;border:1px solid var(--line)}
.fpanel.on{display:flex;animation:drop .18s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fpanel .fp-body{overflow-y:auto;padding:14px 14px 6px}
.fpanel .fp-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.fp-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--b800);margin:4px 0 8px}
.fp-note{font-size:12px;color:var(--muted);margin:-2px 0 10px;line-height:1.4}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.opt{padding:8px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.opt.on{background:var(--b600);border-color:var(--b600);color:#fff}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opts.grid2 .opt{text-align:left}
.chk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px;width:100%;text-align:left}
.chk:last-child{border-bottom:none}
.chk .box{width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;display:grid;place-items:center;flex:none}
.chk.on .box{background:var(--b600);border-color:var(--b600)}
.chk.on .box::after{content:'';width:10px;height:5px;border:2.5px solid #fff;border-top:none;border-right:none;transform:rotate(-45deg) translate(1px,-1px)}
.chk small{display:block;color:var(--muted);font-size:11.5px}
.sw{width:42px;height:24px;border-radius:12px;background:#cbd5e1;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chk.on .sw{background:var(--b600)}.chk.on .sw::after{left:21px}
.range-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--b600);margin:0 0 12px}

/* swipe */
.swipe-wrap{display:flex;flex-direction:column;height:100%;padding:10px 12px 8px;gap:8px}
.stack{position:relative;flex:1;min-height:330px}
.card{position:absolute;inset:0;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(15,40,100,.16);overflow:hidden;touch-action:none;user-select:none;display:flex;flex-direction:column;will-change:transform}
.card.back{transform:scale(.95) translateY(12px);opacity:.7;pointer-events:none}
.hero{flex:1;position:relative;min-height:0;overflow:hidden}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,rgba(5,20,55,.85))}
.over{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.over h3{margin:0 0 4px;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.over .sub{font-size:13px;opacity:.92;display:flex;gap:10px;flex-wrap:wrap}
.tagrow{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.93);color:var(--b900)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.info{padding:12px 16px 14px;display:grid;gap:8px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini{background:var(--b50);border-radius:10px;padding:7px 8px;font-size:11px;color:var(--muted);font-weight:600}
.mini b{display:block;color:var(--ink);font-size:13px}
.elig{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:12px;font-size:12.5px;line-height:1.35}
.elig.ok{background:var(--okbg);color:#065f46}.elig.warn{background:var(--warnbg);color:#9a3412}.elig.bad{background:var(--badbg);color:#991b1b}.elig.info{background:var(--b50);color:var(--b900)}
.elig b{display:block;font-size:13px}
.stamp{position:absolute;top:30px;padding:6px 14px;border:4px solid;border-radius:10px;font-weight:800;font-size:24px;letter-spacing:.05em;opacity:0;z-index:3;transform:rotate(-14deg);background:rgba(255,255,255,.85)}
.stamp.yes{left:22px;color:#10b981;border-color:#10b981}
.stamp.no{right:22px;color:#ef4444;border-color:#ef4444;transform:rotate(14deg)}
.stamp.up{left:50%;top:40%;transform:translateX(-50%);color:var(--b500);border-color:var(--b500);font-size:18px}
.hint-up{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.actions{display:flex;justify-content:center;align-items:center;gap:16px}
.act{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(15,40,100,.15);display:grid;place-items:center}
.act.sm{width:42px;height:42px}
.act svg{width:25px;height:25px}.act.sm svg{width:19px;height:19px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.empty h3{color:var(--ink);margin:10px 0 6px}
.rm-hero{flex:1;position:relative;min-height:0;display:grid;place-items:center}
.compat{position:absolute;top:12px;right:12px;background:#fff;border-radius:14px;padding:6px 10px;text-align:center;font-weight:800;color:var(--b700);font-size:18px;line-height:1}
.compat small{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.c{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--b50);color:var(--b800);border:1px solid var(--b100)}
.c.g{background:var(--okbg);color:var(--ok);border-color:#a7f3d0}.c.o{background:var(--warnbg);color:var(--warn);border-color:#fed7aa}.c.r{background:var(--badbg);color:var(--bad);border-color:#fecaca}
.ctx{font-size:12px;color:var(--b900);background:var(--b50);border:1px solid var(--b100);border-radius:10px;padding:7px 10px;line-height:1.35}
.ctx a{color:var(--b600);font-weight:700;cursor:pointer}

/* lists */
.pad{padding:14px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.45}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.search input{border:none;outline:none;flex:1;background:none}
.lcard{display:flex;gap:12px;background:#fff;border-radius:var(--r);padding:10px;margin-top:10px;border:1px solid var(--line);text-align:left;width:100%}
.lcard .thumb{width:100px;height:100px;border-radius:12px;overflow:hidden;flex:none;position:relative}
.lcard .thumb svg{width:100%;height:100%}
.lcard h4{margin:0 0 3px;font-size:14.5px;line-height:1.25}
.lcard .meta{font-size:12px;color:var(--muted);margin-bottom:5px}
.price{font-weight:800;color:var(--b700);font-size:15px}
.price small{font-weight:600;color:var(--muted);font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--b600);color:#fff}
.btn.ghost{background:#fff;color:var(--b700);border:1px solid var(--b200)}
.btn.block{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sortsel{border:none;background:none;font-weight:700;color:var(--b700);font-size:13px}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgba(8,20,50,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;background:#fff;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#cbd5e1;margin:8px auto 2px;flex:none}
.sheet .close{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sheet .body{overflow-y:auto;padding:0 0 10px}
.dhero{height:200px;position:relative;margin:6px 12px 0;border-radius:16px;overflow:hidden}
.dhero svg.art{width:100%;height:100%}
.sec{padding:14px 16px 4px}
.sec h5{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--b800)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:600;text-align:right}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci{border-radius:12px;padding:9px 10px;font-size:12px;border:1px solid var(--line);background:#fff}
.ci b{display:block;font-size:12.5px;margin-top:2px;color:var(--ink)}
.ci .lbl{color:var(--muted);font-weight:600}
.ci.ok{border-color:#a7f3d0;background:var(--okbg)}.ci.warn{border-color:#fed7aa;background:var(--warnbg)}.ci.bad{border-color:#fecaca;background:var(--badbg)}
.req{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rr{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;align-items:flex-start}
.rr:first-child{border-top:none}
.ic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800}
.ic.y{background:var(--okbg);color:var(--ok)}.ic.n{background:var(--badbg);color:var(--bad)}.ic.m{background:var(--warnbg);color:var(--warn)}
.rr b{display:block}.rr small{color:var(--muted)}
.review{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.review .who{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;gap:8px}
.vbadge{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--b100);color:var(--b800);white-space:nowrap}
.vbadge.lived{background:#dcfce7;color:#166534}
.stars{color:#f59e0b;letter-spacing:1px;font-size:13px}
.review p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.cost{background:var(--b50);border-radius:14px;padding:12px}
.cost .total{display:flex;justify-content:space-between;border-top:1px dashed var(--b300);margin-top:10px;padding-top:10px;font-weight:800;color:var(--b900)}
.sticky-cta{position:sticky;bottom:0;padding:12px 16px;background:linear-gradient(rgba(255,255,255,0),#fff 30%);display:flex;gap:8px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;width:100%;text-align:left}
.person-row b{display:block;font-size:14px}
.person-row span{font-size:12px;color:var(--muted)}

/* chat */
.conv{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);width:100%;text-align:left}
.conv .t{flex:1;min-width:0}
.conv .t b{display:block;font-size:14.5px}
.conv .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;height:100%}
.thread-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.thread-h .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:4px;border-radius:10px}
.thread-h .who:active{background:var(--b50)}
.prop-strip{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--b50);border-bottom:1px solid var(--b100);width:100%;text-align:left}
.prop-strip .th{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none}
.prop-strip .th svg{width:100%;height:100%}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--b600);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:var(--b50);color:var(--b800);font-size:12px;font-weight:600;border-radius:10px}
.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none}

/* map */
.mapwrap{position:relative;margin:0 12px;border-radius:18px;overflow:hidden;border:1px solid var(--b200);background:#eef2f7;touch-action:none}
.mapwrap svg{display:block;width:100%;touch-action:none;cursor:grab}
.mapwrap svg:active{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(10,34,87,.2);font-size:18px;font-weight:700;color:var(--b800);display:grid;place-items:center}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 9px;font-size:10.5px;font-weight:600;color:var(--ink2);display:grid;gap:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:10px 12px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .lcard{flex:none;width:300px;margin:0;scroll-snap-align:center}
.carousel .lcard.sel{border-color:var(--b600);box-shadow:0 0 0 2px var(--b200)}

/* guide */
.acc{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.acc .num{width:34px;height:34px;border-radius:10px;background:var(--b50);color:var(--b700);display:grid;place-items:center;font-size:18px;flex:none}
.acc .ttl{flex:1}.acc .ttl b{display:block;font-size:14.5px}.acc .ttl span{font-size:12px;color:var(--muted)}
.acc .chev{transition:transform .2s;color:var(--muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc .content{display:none;padding:0 16px 14px;font-size:14px;line-height:1.55;color:var(--ink2)}
.acc.open .content{display:block}
.acc .content p{margin:0 0 10px}.acc .content ul{margin:0 0 10px;padding-left:18px}.acc .content li{margin-bottom:5px}
.acc .ttl span.foryou,.foryou{font-size:10px;color:#fff;font-weight:800;background:var(--b600);color:#fff;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.callout{background:var(--b50);border-left:4px solid var(--b500);border-radius:10px;padding:10px 12px;margin:8px 0 10px;font-size:13.5px}
.callout.warn{background:var(--warnbg);border-color:#fb923c}
.def{display:grid;gap:8px;margin-bottom:10px}
.def div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.def b{color:var(--b800)}
.progress{height:8px;background:var(--b100);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b500),var(--b700));border-radius:4px;transition:width .3s}
.hero-guide{background:linear-gradient(135deg,var(--b700),var(--b900));color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-guide h2{margin:0 0 6px;font-size:21px}.hero-guide p{margin:0;opacity:.88;font-size:13.5px;line-height:1.45}
.pers{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-top:10px}

/* me */
.me-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.me-card h4{margin:0 0 4px;font-size:15.5px}
.me-card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.me-top{display:flex;gap:14px;align-items:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2.5px var(--b600)}
.hairs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.hairs button{border:2px solid var(--line);border-radius:12px;padding:3px;background:#fff;display:grid;place-items:center}
.hairs button.on{border-color:var(--b600)}
.meter{height:6px;border-radius:3px;background:var(--b100);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--b600)}
.lockpill{font-size:10.5px;font-weight:700;background:#f1f5f9;color:var(--muted);padding:3px 7px;border-radius:6px}
.toast{position:absolute;left:50%;top:66px;transform:translate(-50%,-20px);background:var(--b900);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.match{position:absolute;inset:0;z-index:30;background:linear-gradient(160deg,rgba(29,78,216,.97),rgba(10,34,87,.98));color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.match.on{display:flex;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.match h2{font-size:28px;margin:6px 0 0}.match p{margin:0;opacity:.9;max-width:320px;line-height:1.45}
.match .preview{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 14px;font-size:13.5px;max-width:330px;text-align:left}
.empty-state{text-align:center;color:var(--muted);padding:40px 24px}
.lb{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.lb-Broker{background:#e0e7ff;color:#3730a3}.lb-Landlord{background:var(--b100);color:var(--b800)}.lb-Roommate{background:#dcfce7;color:#166534}

 const decide=dir=>{(homes?(dir==='yes'?S.liked:S.passed):(dir==='yes'?S.rmLiked:S.rmPassed)).add(top.id);S.hist.push({homes,id:top.id});if(dir==='yes')homes?likeHome(top):likePerson(top);drawStack();};
 attachDrag(el,decide,open);bindActs({el,decide,open});
}
function bindActs(c){
 $('#no').onclick=()=>c&&fly(c.el,'no',c.decide);$('#yes').onclick=()=>c&&fly(c.el,'yes',c.decide);$('#info').onclick=()=>c&&c.open();
 $('#undo').onclick=()=>{const h=S.hist.pop();if(!h)return toast('Nothing to undo');
  if(h.homes){S.liked.delete(h.id);S.passed.delete(h.id);S.swipeMode='homes';}else{S.rmLiked.delete(h.id);S.rmPassed.delete(h.id);S.swipeMode='rm';}renderSwipe();};
}
function fly(el,dir,cb){el.style.transition='transform .35s ease,opacity .35s';el.style.transform=`translate(${dir==='yes'?600:-600}px,40px) rotate(${dir==='yes'?25:-25}deg)`;el.style.opacity='0';el.querySelector('.stamp.'+dir).style.opacity=1;setTimeout(()=>cb(dir),280);}
function attachDrag(el,decide,open){
 let sx=0,sy=0,dx=0,dy=0,down=false;const sY=el.querySelector('.stamp.yes'),sN=el.querySelector('.stamp.no'),sU=el.querySelector('.stamp.up');
 el.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;el.setPointerCapture(e.pointerId);el.style.transition='none';});
 el.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
  sY.style.opacity=Math.max(0,Math.min(1,dx/100));sN.style.opacity=Math.max(0,Math.min(1,-dx/100));sU.style.opacity=Math.abs(dx)<60?Math.max(0,Math.min(1,-dy/110)):0;});
 const end=()=>{if(!down)return;down=false;if(dx>110)return fly(el,'yes',decide);if(dx<-110)return fly(el,'no',decide);
  el.style.transition='transform .3s';el.style.transform='';[sY,sN,sU].forEach(s=>s.style.opacity=0);if((dy<-100&&Math.abs(dx)<70)||(Math.abs(dx)<6&&Math.abs(dy)<6))open();};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

function intro(l){const m=S.me,e=elig(l);

function findConvo(pid,lid){return S.convos.find(c=>c.person===pid&&(lid==null||c.listing===lid));}
function startConvo(pid,lid,text,reply){
 let c=findConvo(pid,lid);if(c)return c;
 c={id:'c'+(S.nextId++),person:pid,listing:lid||null,unread:0,msgs:[{w:'sys',t:'Matched via swipe · Nov 13'},{w:'me',t:text}]};S.convos.unshift(c);
 setTimeout(()=>{c.msgs.push({w:'them',t:reply});if(S.view==='inbox'&&S.openConvo===c.id)renderInbox();else{c.unread++;renderNav();toast('💬 New reply from '+P[pid].name);}},4000);

function bindMap(){
 const svg=$('#mapsvg'),pts=new Map();let moved=0,pinT=null;
 const loc=e=>{const r=svg.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
 svg.onpointerdown=e=>{const pin=e.target.closest('[data-pin]');if(pts.size===0){moved=0;pinT=pin;}pts.set(e.pointerId,loc(e));svg.setPointerCapture(e.pointerId);};
 svg.onpointermove=e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId),cur=loc(e);
  if(pts.size===1){S.map.tx+=cur.x-prev.x;S.map.ty+=cur.y-prev.y;moved+=Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y);}
  else{const other=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(prev.x-other.x,prev.y-other.y),d1=Math.hypot(cur.x-other.x,cur.y-other.y);
   const mx=(cur.x+other.x)/2,my=(cur.y+other.y)/2,pmx=(prev.x+other.x)/2,pmy=(prev.y+other.y)/2;S.map.tx+=mx-pmx;S.map.ty+=my-pmy;if(d0>0)zoomAt(mx,my,d1/d0);moved+=20;}
  pts.set(e.pointerId,cur);requestAnimationFrame(applyMap);};
 const up=e=>{pts.delete(e.pointerId);if(pts.size===0&&moved<6&&pinT){selectPin(+pinT.dataset.pin);}if(pts.size===0)pinT=null;};
 svg.onpointerup=up;svg.onpointercancel=up;
 svg.onwheel=e=>{e.preventDefault();const p=loc(e);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15);applyMap();};
 const c=()=>({x:svg.clientWidth/2,y:svg.clientHeight/2});
 $('#zin').onclick=()=>{const p=c();zoomAt(p.x,p.y,1.4);applyMap();};$('#zout').onclick=()=>{const p=c();zoomAt(p.x,p.y,1/1.4);applyMap();};
 $('#zme').onclick=()=>{mapInit();applyMap();};
}

 $('#main').innerHTML=`<div class="pad">
  <div class="me-card"><div class="me-top"><div style="position:relative">${meAv(84)}</div><div style="flex:1;min-width:0"><div class="h1" style="font-size:20px;margin:0">${esc(m.name)}, ${m.age}</div><div style="font-size:13px;color:var(--muted)">${school().short} · ${esc(m.prog)}</div>
   <div style="font-size:11.5px;color:var(--muted);margin-top:8px;font-weight:600">Profile ${pct}% complete</div><div class="meter"><i style="width:${pct}%"></i></div></div></div>
   <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="prevBtn" style="flex:1">👀 Preview my roommate card</button></div></div>

  <div class="me-card"><h4>Your avatar</h4><p class="sub">Build an avatar or upload a photo. Roommates see this on your card.</p>
   <div class="fp-h">Hair</div><div class="hairs">${HAIRS.map(hs=>`<button class="${m.av.h===hs?'on':''}" data-p="me.av.h" data-v='"${hs}"'>${avatar({...m.av,h:hs,b:false,g:false},44)}</button>`).join('')}</div>
   <div class="fp-h">Skin tone</div>${sw('me.av.s',SK)}<div class="fp-h">Hair color</div>${sw('me.av.hc',[...HC,'#1e3a8a','#be185d'])}
   <div class="fp-h">Top</div>${sw('me.av.sh',SH)}<div class="fp-h">Background</div>${sw('me.av.bg',BG)}
   <div class="opts">${chkO('me.av.g','👓 Glasses')}${chkO('me.av.b','🧔 Beard')}</div>
   <label class="btn ghost sm" style="cursor:pointer">📷 Upload a photo instead<input type="file" accept="image/*" id="photoIn" style="display:none"></label>${m.photo?' <button class="btn ghost sm" id="rmPhoto">Use avatar</button>':''}</div>

  <div class="me-card"><h4>About you</h4><p class="sub">Who you are — shown on your roommate card.</p>
   <div class="two"><div class="field"><label>Name</label><input data-in="me.name" value="${esc(m.name)}"></div><div class="field"><label>Age</label><input type="number" data-in="me.age" data-num="1" value="${m.age}"></div></div>
   <div class="two"><div class="field"><label>Pronouns</label><select data-in="me.pr">${['she/her','he/him','they/them','prefer not to say'].map(x=>`<option ${m.pr===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>School</label><select data-in="me.school">${Object.entries(SCHOOLS).map(([k,s])=>`<option value="${k}" ${m.school===k?'selected':''}>${s.short}</option>`).join('')}</select></div></div>
   <div class="field"><label>Year & program</label><input data-in="me.prog" value="${esc(m.prog)}"></div>
   <div class="field"><label>Bio</label><textarea data-in="me.bio" rows="3">${esc(m.bio)}</textarea></div>
   <div class="fp-h">Interests</div><div class="opts">${['Cooking','Running','Photography','Gaming','Music','Hiking','Film','Coding','Art','Sports','Reading','Nightlife','Yoga','Travel'].map(t=>mopt('me.tags',t,t)).join('')}</div></div>

  <div class="me-card"><h4>What you're looking for</h4><p class="sub">Drives who and what shows up in your swipe decks.</p>
   <div class="fp-h">My situation</div><div class="opts grid2" style="grid-template-columns:1fr">${opt('me.sit','room','🛏️ I need a room in an existing place')}${opt('me.sit','together','🔎 I want roommates to search with')}${opt('me.sit','fill','🏠 I have a place and need to fill rooms')}</div>
   <div class="fp-h">${m.sit==='together'?'People already in my group (incl. me)':'How many of us are moving'}</div><div class="opts">${[1,2,3,4].map(n=>opt('me.group',n,n===1?'Just me':n+' of us')).join('')}</div>
   ${m.sit==='fill'?`<div class="fp-h">Rooms I need to fill</div><div class="opts">${[1,2,3].map(n=>opt('me.spots',n,n+' room'+(n>1?'s':''))).join('')}</div>`:''}
   <div class="fp-h">Move-in · ${mvLabel(m.mv)}</div>${mvPicker('me.mv',false,false)}
   <div class="fp-h">Max rent per person</div>${rngMe('f.maxPrice',800,3000,50)}
   <div class="fp-h">I'm comfortable living with</div><div class="opts">${mopt('rf.genders','f','Women')}${mopt('rf.genders','m','Men')}${mopt('rf.genders','nb','Non-binary people')}</div></div>

  <div class="me-card"><h4>Lifestyle</h4><p class="sub">Used for your match % with roommates.</p>
   <div class="fp-h">Schedule</div><div class="opts">${opt('me.sleep','early','☀️ Early bird')}${opt('me.sleep','night','🌙 Night owl')}</div>
   <div class="fp-h">Cleanliness</div><div class="opts">${opt('me.clean',1,'Relaxed')}${opt('me.clean',2,'Tidy')}${opt('me.clean',3,'Very tidy')}</div>
   <div class="fp-h">Home vibe</div><div class="opts">${opt('me.social','quiet','🤫 Quiet')}${opt('me.social','balanced','⚖️ Balanced')}${opt('me.social','social','🎉 Social')}</div>
   <div class="fp-h">Guests over</div><div class="opts">${['Rarely','Sometimes','Often'].map(x=>opt('me.guests',x,x)).join('')}</div>
   ${chkS('me.pets','Fine living with pets')}${chkS('me.smoke','I smoke')}</div>

  <div class="me-card" id="leaseSec"><div class="between"><h4>Leasing & cosigner</h4><span class="lockpill">🔒 Private</span></div><p class="sub">Never shown to landlords until you apply. We use it to tell you, on every listing, if you can sign and what you'd need.</p>
   ${chkS('me.intl','I\'m an international student','We\'ll check which landlords accept I-20s and tailor your guide')}
   ${m.intl?`<div style="background:var(--b50);border-radius:12px;padding:12px;margin:8px 0 10px">
    <div class="two"><div class="field"><label>Home country</label><input data-in="me.country" value="${esc(m.country)}"></div><div class="field"><label>Funding on I-20</label><select data-in="me.funding">${['Family sponsor','Scholarship','Personal funds','Employer/government sponsor'].map(x=>`<option ${m.funding===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    ${chkS('me.i20','I have my I-20','Some landlords accept it as proof of funds instead of a cosigner')}</div>`:''}
   <div class="fp-h">Cosigner / guarantor</div><div class="opts grid2" style="grid-template-columns:1fr">${opt('me.cosigner','none','I don\'t have one')}${opt('me.cosigner','us','US-based cosigner (e.g. parent in the US)')}${opt('me.cosigner','intl','Cosigner living outside the US')}</div>
   <div class="two"><div class="field"><label>My annual income ($)</label><input type="number" data-in="me.income" data-num="1" value="${m.income}"></div>
   <div class="field"><label>US credit score</label><select data-in="me.credit">${[['none','None yet'],['600','600–649'],['650','650–699'],['700','700+']].map(([v,t])=>`<option value="${v}" ${m.credit===v?'selected':''}>${t}</option>`).join('')}</select></div></div>
   <button class="btn ghost sm" id="toGuide">📘 Open my First Lease guide</button></div>
 </div>`;
 const main=$('#main');
 main.onclick=e=>{if(e.target.closest('#photoIn'))return;handleOptClick(e,()=>render(true));};
 $$('[data-in]').forEach(i=>i.onchange=()=>{setP(i.dataset.in,i.dataset.num?+i.value:i.value);if(i.dataset.in==='me.school')S.map=null;render(true);});
 $$('[data-rp]').forEach(i=>i.oninput=()=>{setP(i.dataset.rp,+i.value);$(`[data-out="${i.dataset.rp}"]`).textContent=money(+i.value);});
 $('#photoIn').onchange=e=>{const f=e.target.files[0];if(f){S.me.photo=URL.createObjectURL(f);render(true);}};
 if($('#rmPhoto'))$('#rmPhoto').onclick=e=>{e.stopPropagation();S.me.photo=null;render(true);};
 $('#toGuide').onclick=e=>{e.stopPropagation();go('guide');};
 $('#prevBtn').onclick=e=>{e.stopPropagation();const p={...S.me,id:'preview',role:'student',sit:{room:'room',together:'together',fill:'has'}[m.sit],spots:m.spots,budget:[Math.min(S.f.maxPrice,1000),S.f.maxPrice],g:'nb',intl:m.intl};
  openSheet(`<div class="sec" style="padding-top:20px"><div class="h1">How others see you</div><p class="lead">This is your card in other people's roommate deck.</p><div style="position:relative;height:460px">${rmCard(p,0,meAv(190))}</div></div>`);};
}
const chkO=(path,t)=>`<button class="opt ${getP(path)?'on':''}" data-p="${path}" data-b="1">${t}</button>`;
const chkS=(path,t,sub)=>chk(path,t,sub,1);
const rngMe=(path,min,max,step)=>`<div class="range-row"><span></span><span data-out="${path}">${money(getP(path))}</span></div><input type="range" min="${min}" max="${max}" step="${step}" value="${getP(path)}" data-rp="${path}">`;

/* =================== GUIDE =================== */
const GUIDE=[
 {i:'🗺️',t:'How renting works in Boston',s:'Sept 1, brokers, sublets & takeovers',h:()=>`
  <p>Boston is unusual: a huge share of leases start and end on <b>September 1</b>. Listings for September show up from January to spring, and the best places go early.</p>
  <div class="def"><div><b>Broker / agent</b> — Shows you places for many landlords. Since Aug 1, 2025, Massachusetts law says whoever hires the broker pays — so if the landlord hired them, you shouldn't be charged a broker fee.</div>
  <div><b>Landlord or property manager</b> — Rent directly from the owner or a management company.</div>
  <div><b>Takeover / sublet</b> — A tenant leaves mid-lease (often January or June). Make sure the landlord approves and you're added to the lease.</div>
  <div><b>Joining roommates</b> — An existing group needs one more. Use the 🤝 Roommates deck.</div></div>`},
 {i:'✍️',t:'Signer, cosigner, guarantor',s:'Who is responsible for the rent',h:()=>`
  <div class="def"><div><b>Signer (tenant)</b> — You. You sign the lease, live there and pay rent.</div>
  <div><b>Cosigner</b> — Signs with you and is equally responsible for rent, though they don't live there.</div>
  <div><b>Guarantor</b> — Promises to pay only if you don't. Landlords often use the two words interchangeably.</div>
  <div><b>Guarantor service</b> — A company (TheGuarantors, Leap, Insurent…) that acts as your guarantor for a one-time fee.</div></div>
  <div class="callout warn"><b>Joint & several liability:</b> On a group lease, every tenant can be held responsible for the <i>whole</i> rent if a roommate stops paying.</div>`},
 {i:'💵',t:'The 40× / 80× income rule',s:'How landlords decide if you qualify',h:()=>`
  <p>Many landlords want your <b>yearly income to be 40× the monthly rent</b>, and a cosigner's to be <b>80×</b>.</p>
  <div class="cost" style="margin-bottom:10px"><div class="kv" id="ruleCalc"></div><input type="range" id="ruleR" min="800" max="3000" step="50" value="1300" style="margin:10px 0 0"></div>
  <p>Students rarely meet 40× alone — that's why cosigners and guarantor services exist. Every listing shows its exact rule against <b>your</b> profile.</p>`},
 {i:'🌍',t:'International students & your I-20',s:'Options without US credit or a US cosigner',intl:true,h:()=>`
  <p>${S.me.country?`Coming from ${esc(S.me.country)}, you`:'You'} probably don't have US credit or US income yet. Here's what works — and every listing tells you which ones that landlord accepts:</p>
  <ul><li><b>I-20 as proof of funds</b> — Your I-20 shows how your studies are funded${S.me.funding?` (yours: ${esc(S.me.funding.toLowerCase())})`:''}. Some landlords accept it instead of a cosigner. It isn't a cosigner — it's evidence you can pay. Bring bank statements too.</li>
  <li><b>Guarantor service</b> — Most widely accepted. One-time fee, often around a month's rent.</li>
  <li><b>Cosigner abroad</b> — A parent at home. Fewer landlords accept it; you'll need translated statements.</li>
  <li><b>Prepaid rent</b> — In Massachusetts a landlord can't <i>require</i> more than first, last, security and a lock fee, but some will consider extra prepaid rent you offer. Ask your school's off-campus housing office before doing this.</li>
  <li><b>University housing</b> — Often skips the cosigner question entirely.</li></ul>
  <div class="callout">Use <b>Cosigner ▾ → I-20 accepted</b> in Swipe, Browse or Map to only see places that take your I-20.</div>`},
 {i:'🏠',t:'Getting a cosigner (US students)',s:'Parents, credit and what to ask for',dom:true,h:()=>`
  <ul><li><b>Usually a parent or relative</b> with good credit (often 650–700+) and income of ~80× the monthly rent.</li>
  <li><b>What they'll need:</b> photo ID, pay stubs or tax return, and a credit check. Many landlords let cosigners sign online.</li>
  <li><b>No eligible cosigner?</b> A guarantor service works for domestic students too.</li>
  <li><b>Start building credit</b> — a student card paid in full each month helps you qualify alone in a year or two.</li></ul>`},
 {i:'🧾',t:'Money up front in Massachusetts',s:'First, last, security — and what\'s not allowed',h:()=>`
  <p>Before you move in, a Massachusetts landlord can only collect:</p>
  <ul><li><b>First month's rent</b></li><li><b>Last month's rent</b></li><li><b>Security deposit</b> — no more than one month's rent, kept in a separate account and returned after move-out minus documented damage.</li><li><b>Cost of a new lock</b></li></ul>
  <div class="callout warn">Application fees and "holding fees" beyond these are generally not allowed in MA. If the landlord hired the broker, the landlord pays the broker fee (law since Aug 1, 2025).</div>
  <div class="cost"><b style="font-size:13px;color:var(--b900)">Quick calculator</b><div class="field" style="margin:8px 0 0"><label>Your monthly rent share</label><input type="number" id="ucR" value="1300"></div>
   ${chk('g.last','Last month due',0,1)}${chk('g.lock','Lock change (~$75)',0,1)}${chk('g.gua','Guarantor service',0,1)}
   <div class="total"><span>Estimated total up front</span><span id="ucT"></span></div></div>`},
 {i:'📄',t:'Reading your lease',s:'Terms to check before signing',h:()=>`
  <ul><li><b>Dates</b> — Exact start and end. Does it auto-renew?</li><li><b>Individual vs joint</b> — Are you responsible for only your room?</li><li><b>Subletting</b> — Can you sublet for summer${S.me.intl?' or if you go home for a semester':''}?</li><li><b>Early termination</b> — What it costs to leave early.</li><li><b>Utilities & repairs</b> — Who pays what; how to request maintenance.</li><li><b>Move-out</b> — Cleaning rules and when the deposit comes back.</li></ul>
  <div class="callout">Ask for the lease by email before signing day and keep a copy of everything.</div>`},
 {i:'🔍',t:'Touring checklist',s:'Mold, laundry, pests, heat & more',h:()=>`
  <ul><li>🍄 <b>Mold</b> — Musty smell, dark spots on bathroom ceilings, window sills, basements. Fresh paint on one patch can be a cover-up.</li><li>🧺 <b>Laundry</b> — In-unit, building, or laundromat?</li><li>🔥 <b>Heat</b> — Boston winters are long. What kind, and who pays?</li><li>🚿 <b>Water</b> — Run the shower; check pressure and hot water.</li><li>🐜 <b>Pests</b> — Droppings in cabinets, traps.</li><li>🔒 <b>Safety</b> — Locks, smoke & CO detectors.</li><li>📸 <b>Move-in photos</b> — Video every room on day one.</li></ul>
  <div class="callout">Toured a place? <b>Leave a review</b> so the next student doesn't have to.</div>`},
 {i:'🚩',t:'Scam red flags',s:'Protect your deposit',h:()=>`
  <ul><li>Wire, gift card or crypto before you see the place.</li><li>"Landlord" is abroad and will mail you keys.</li><li>Rent far below everything nearby.</li><li>Pressure to decide today, or asking for ${S.me.intl?'your passport':'your SSN'} before a showing.</li><li>Being told to pay a broker fee for a broker the landlord hired.</li></ul>
  <div class="callout warn">Look for the <b>✔ Verified</b> badge and reviews from verified past tenants.</div>`}];
S.g={last:true,lock:false,gua:S.me.intl};
function guideItems(){return GUIDE.filter(g=>!(g.intl&&!S.me.intl)&&!(g.dom&&S.me.intl)).sort((a,b)=>(b.intl?1:0)-(a.intl?1:0));}
function renderGuide(){
 const G=guideItems(),done=G.filter(g=>S.guideDone.has(g.t)).length,m=S.me;
 $('#main').innerHTML=`<div class="pad"><div class="hero-guide"><div style="font-size:12px;font-weight:700;opacity:.8;letter-spacing:.06em">FIRST LEASE 101 · BOSTON</div><h2>Your first lease, explained</h2>
  <p>Cosigners, the 40× rule, what Massachusetts lets landlords charge, and what to check on a tour.</p>
  <div class="pers">${m.intl?'🌍 Tailored for an international student':'🇺🇸 Tailored for a US student'} · ${school().short}</div></div>
  <div class="between" style="font-size:12.5px;font-weight:700;color:var(--ink2)"><span>Your progress</span><span>${done}/${G.length} read</span></div><div class="progress"><i style="width:${done/G.length*100}%"></i></div>
  ${G.map(g=>`<div class="acc ${S.guideOpen===g.t?'open':''}"><button data-t="${esc(g.t)}"><span class="num">${S.guideDone.has(g.t)?'✅':g.i}</span><span class="ttl"><b>${g.t}${g.intl||g.dom?'<span class="foryou">FOR YOU</span>':''}</b><span>${g.s}</span></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button><div class="content">${S.guideOpen===g.t?g.h():''}</div></div>`).join('')}
  <p style="font-size:12px;color:var(--muted)">Not ${m.intl?'an international student':'a US student'}? <a style="color:var(--b600);font-weight:700;cursor:pointer" id="chg">Change it in your profile</a> and the guide updates.</p>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.45">General guidance, not legal advice. Check with your university's off-campus housing office or mass.gov for current rules.</p></div>`;
 $$('.acc>button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;S.guideOpen=S.guideOpen===t?null:t;if(S.guideOpen)S.guideDone.add(t);renderGuide();const el=b.parentElement;if(S.guideOpen)setTimeout(()=>{const nb=[...$$('.acc>button')].find(x=>x.dataset.t===t);nb&&nb.scrollIntoView({block:'start',behavior:'smooth'});},10);});
 $('#chg').onclick=()=>{go('me');setTimeout(()=>$('#leaseSec').scrollIntoView({behavior:'smooth'}),50);};
 if($('#ruleR')){const f=()=>{const r=+$('#ruleR').value;$('#ruleCalc').innerHTML=`<span>Monthly rent</span><span>${money(r)}</span><span>You need (40×)</span><span>${money(r*40)}/yr</span><span>Cosigner needs (80×)</span><span>${money(r*80)}/yr</span>`;};$('#ruleR').oninput=f;f();}
 if($('#ucR')){const f=()=>{const r=+$('#ucR').value||0;$('#ucT').textContent=money(r*2+(S.g.last?r:0)+(S.g.lock?75:0)+(S.g.gua?r*.9:0));};$('#ucR').oninput=f;f();
  $$('.acc.open .chk').forEach(b=>b.onclick=()=>{const k=b.dataset.p.split('.')[1];S.g[k]=!S.g[k];b.classList.toggle('on',S.g[k]);f();});}
}

render();
</script>
