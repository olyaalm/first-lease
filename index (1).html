<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>First Lease — Rentals + Roommates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b900:#0a2257;--b800:#0f3b8c;--b700:#1d4ed8;--b600:#2563eb;--b500:#3b82f6;--b300:#93c5fd;--b200:#bfdbfe;--b100:#dbeafe;--b50:#eff6ff;
--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;--bg:#f6f8fc;--ok:#059669;--okbg:#ecfdf5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dfe8f7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(15,59,140,.12)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:6}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--b900)}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--b500),var(--b800));display:grid;place-items:center}
.me-btn{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--b200);padding:0}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--b600)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:#dc2626;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.seg{display:flex;background:#e6edf9;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--b800)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(15,59,140,.15);color:var(--b600)}

/* filters */
.fbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fbar::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:8px;background:#fff;border:1px solid #cbd5e1;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.fbtn svg{width:12px;height:12px;opacity:.7}
.fbtn.active{background:var(--b50);border-color:var(--b500);color:var(--b700)}
.fbtn.open{background:var(--b600);border-color:var(--b600);color:#fff}
.fshade{position:absolute;inset:0;z-index:15;background:rgba(8,20,50,.18);display:none}.fshade.on{display:block}
.fpanel{position:absolute;left:10px;right:10px;z-index:16;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(10,34,87,.25);display:none;flex-direction:column;max-height:62%;border:1px solid var(--line)}
.fpanel.on{display:flex}
.fp-body{overflow-y:auto;padding:14px 14px 6px}
.fp-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.fp-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--b800);margin:4px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.opt{padding:8px 12px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.opt.on{background:var(--b600);border-color:var(--b600);color:#fff}
.opt:disabled{opacity:.35}
.chk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px;width:100%;text-align:left}
.sw{width:42px;height:24px;border-radius:12px;background:#cbd5e1;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.chk.on .sw{background:var(--b600)}.chk.on .sw::after{left:21px}
.range-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--b600);margin:0 0 12px}
select.sel{border:1px solid #cbd5e1;border-radius:9px;padding:8px 10px;background:#fff;width:100%}

/* listing cards (Zillow-like) */
.pad{padding:14px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.45}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px}
.search{min-width:0}.search input{border:none;outline:none;flex:1;background:none;min-width:0;width:100%}
.hcard{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;text-align:left;width:100%;display:block;box-shadow:0 2px 8px rgba(15,40,100,.05)}
.hcard .ph{height:190px;position:relative;overflow:hidden}
.hcard .ph svg.art{width:100%;height:100%;display:block}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.heart svg{width:20px;height:20px}
.ptag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.95);color:var(--b900)}
.hcard .bd{padding:10px 12px 12px}
.hprice{font-size:20px;font-weight:800;letter-spacing:-.01em}
.hprice small{font-size:13px;font-weight:600;color:var(--muted)}
.hfacts{font-size:13.5px;color:var(--ink2);margin:2px 0}
.hfacts b{font-weight:700}
.haddr{font-size:13px;color:var(--muted)}
.hby{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:10px;font-weight:700;font-size:14.5px;background:var(--b600);color:#fff}
.btn.ghost{background:#fff;color:var(--b700);border:1px solid var(--b200)}
.btn.block{width:100%}.btn.sm{padding:8px 12px;font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sortsel{border:none;background:none;font-weight:700;color:var(--b700);font-size:13px}
.c{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--b50);color:var(--b800);border:1px solid var(--b100)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* roommate swipe */
.swipe-wrap{display:flex;flex-direction:column;height:100%;padding:10px 12px 8px;gap:8px}
.stack{position:relative;flex:1;min-height:340px}
.card{position:absolute;inset:0;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(15,40,100,.16);overflow:hidden;touch-action:none;user-select:none;display:flex;flex-direction:column}
.card.back{transform:scale(.95) translateY(12px);opacity:.7;pointer-events:none}
.rm-hero{flex:1;position:relative;min-height:0;display:grid;place-items:center}
.shade{position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(5,20,55,.85))}
.over{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.over h3{margin:0 0 3px;font-size:24px}
.tagrow{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.93);color:var(--b900)}
.info{padding:12px 16px 14px;display:grid;gap:8px}
.common{background:var(--okbg);border:1px solid #a7f3d0;border-radius:12px;padding:9px 10px}
.common .lbl{font-size:11px;font-weight:800;color:#047857;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.cc{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:#fff;color:#065f46;border:1px solid #a7f3d0}
.stamp{position:absolute;top:30px;padding:6px 14px;border:4px solid;border-radius:10px;font-weight:800;font-size:24px;opacity:0;z-index:3;transform:rotate(-14deg);background:rgba(255,255,255,.85)}
.stamp.yes{left:22px;color:#10b981;border-color:#10b981}.stamp.no{right:22px;color:#ef4444;border-color:#ef4444;transform:rotate(14deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:18px}
.act{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(15,40,100,.15);display:grid;place-items:center}
.act.sm{width:44px;height:44px}.act svg{width:25px;height:25px}.act.sm svg{width:19px;height:19px}
.hint{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.empty h3{color:var(--ink);margin:10px 0 6px}
.empty-state{text-align:center;color:var(--muted);padding:40px 24px}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgba(8,20,50,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:#fff;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#cbd5e1;margin:8px auto 2px;flex:none}
.sheet .close{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sheet .body{overflow-y:auto;padding:0 0 10px}
.dhero{height:220px;position:relative;margin:6px 12px 0;border-radius:14px;overflow:hidden}
.dhero svg.art{width:100%;height:100%}
.sec{padding:14px 16px 4px}
.sec h5{margin:0 0 10px;font-size:16px;color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:600;text-align:right}
.sticky-cta{position:sticky;bottom:0;padding:12px 16px;background:linear-gradient(rgba(255,255,255,0),#fff 30%);display:flex;gap:8px}
.person-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;text-align:left}
.person-row b{display:block;font-size:14px}.person-row span{font-size:12px;color:var(--muted)}
.rmcta{display:flex;gap:12px;align-items:center;background:var(--b50);border:1px solid var(--b100);border-radius:14px;padding:12px;width:100%;text-align:left}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;outline:none;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prompt{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}

/* chat */
.conv{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);width:100%;text-align:left}
.conv .t{flex:1;min-width:0}.conv .t b{display:block;font-size:14.5px}
.conv .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;height:100%}
.thread-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.thread-h .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:4px;border-radius:10px}
.prop-strip{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--b50);border-bottom:1px solid var(--b100);width:100%;text-align:left}
.prop-strip .th{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none}.prop-strip .th svg{width:100%;height:100%}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--b600);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:var(--b50);color:var(--b800);font-size:12px;font-weight:600;border-radius:10px}
.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none}

/* map */
.mapwrap{position:relative;overflow:hidden;background:#eef2f7;touch-action:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;touch-action:none;cursor:grab}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(10,34,87,.2);font-size:18px;font-weight:700;color:var(--b800)}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:10px 12px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mini{flex:none;width:280px;display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;scroll-snap-align:center}
.mini.sel{border-color:var(--b600);box-shadow:0 0 0 2px var(--b200)}
.mini .th{width:84px;height:72px;border-radius:8px;overflow:hidden;flex:none}.mini .th svg{width:100%;height:100%}

/* profile */
.me-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.me-card h4{margin:0 0 4px;font-size:15.5px}
.me-card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatch{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2.5px var(--b600)}
.hairs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.hairs button{border:2px solid var(--line);border-radius:12px;padding:3px;background:#fff;display:grid;place-items:center}
.hairs button.on{border-color:var(--b600)}
.toast{position:absolute;left:50%;top:66px;transform:translate(-50%,-20px);background:var(--b900);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.match{position:absolute;inset:0;z-index:30;background:linear-gradient(160deg,rgba(29,78,216,.97),rgba(10,34,87,.98));color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.match.on{display:flex}
.match h2{font-size:28px;margin:6px 0 0}.match p{margin:0;opacity:.9;max-width:320px;line-height:1.45}
.match .preview{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 14px;font-size:13.5px;max-width:330px;text-align:left}
</style>
</head>

  <header class="top">
    <div class="logo"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M10.5 19v-5h3v5" fill="#fff"/></svg></div>First Lease</div>

</div>

function startConvo(pid,lid,text,reply){let c=findConvo(pid);if(c)return c;
 c={id:'c'+(S.nextId++),person:pid,listing:lid,unread:0,msgs:[{w:'sys',t:'New conversation · Nov 13'}]};if(text)c.msgs.push({w:'me',t:text});S.convos.unshift(c);
 if(reply)setTimeout(()=>{c.msgs.push({w:'them',t:reply});if(S.view==='inbox'&&S.openConvo===c.id)renderInbox();else{c.unread++;renderNav();toast('💬 New message from '+P[pid].name);}},3500);
 renderNav();return c;}
function likePerson(p){const cm=common(p),t=`Hey ${p.name.split(' ')[0]}! ${cm.length?'Looks like we have a few things in common ('+cm.slice(0,2).map(x=>x.slice(2).trim().toLowerCase()).join(', ')+'). ':''}${p.sit==='has'?'Is your room still open? I\'d love to see it.':'Want to grab coffee and talk about finding a place?'}`;
 const c=startConvo(p.id,p.listing||null,t,p.sit==='has'?'Hi!! Yes it\'s still open. Want to FaceTime first and then come see it?':'Hey! Coffee sounds great ☕ Free Wednesday after 3?');
 const m=$('#match');m.innerHTML=`<div class="row">${meAv(76)}<div style="margin-left:-14px">${avatar(p.av,76)}</div></div><h2>Said hi!</h2><p>Your message went to <b>${esc(p.name)}</b>. They'll decide if they want to chat.</p><div class="preview">${esc(t)}</div><div class="row" style="margin-top:8px"><button class="btn ghost" id="mKeep">Keep swiping</button><button class="btn" style="background:#fff;color:var(--b700)" id="mOpen">Open chat</button></div>`;
 m.classList.add('on');$('#mKeep').onclick=()=>m.classList.remove('on');$('#mOpen').onclick=()=>{m.classList.remove('on');S.view='inbox';S.openConvo=c.id;render();};}
function renderInbox(){const m=$('#main');
 if(S.openConvo){const c=S.convos.find(x=>x.id===S.openConvo);c.unread=0;renderNav();const p=P[c.person],l=c.listing?LST(c.listing):(p.listing?LST(p.listing):null);
  m.innerHTML=`<div class="thread"><div class="thread-h"><button id="back" style="padding:6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
   <button class="who" id="who">${avatar(p.av,38)}<div><b style="display:block;font-size:14.5px">${esc(p.name)}</b><span style="font-size:12px;color:var(--b600);font-weight:600">View profile</span></div></button></div>
   ${l?`<button class="prop-strip" id="prop"><div class="th">${art(l)}</div><div style="flex:1;min-width:0"><b style="font-size:13px;display:block">${money(l.price)}${perTxt(l)} · ${l.title}</b><span style="font-size:12px;color:var(--muted)">${esc(l.address)}</span></div><span style="color:var(--b600);font-weight:700;font-size:12px">View →</span></button>`:''}
   <div class="msgs" id="msgs">${c.msgs.map(x=>`<div class="bub ${x.w}">${esc(x.t)}</div>`).join('')}</div>
   <form class="composer" id="comp"><input id="mi" placeholder="Message…" autocomplete="off"><button class="btn sm" type="submit">Send</button></form></div>`;
  $('#msgs').scrollTop=1e6;$('#back').onclick=()=>{S.openConvo=null;renderInbox();};$('#who').onclick=()=>openPerson(c.person);if(l)$('#prop').onclick=()=>openListing(l.id);
  $('#comp').onsubmit=e=>{e.preventDefault();const t=$('#mi').value.trim();if(!t)return;c.msgs.push({w:'me',t});renderInbox();setTimeout(()=>{const R=['Sounds good! 👍','Sure, that works for me.','Great, see you then!','Let me check and get back to you.'];c.msgs.push({w:'them',t:R[c.msgs.length%4]});if(S.openConvo===c.id&&S.view==='inbox')renderInbox();else{c.unread++;renderNav();}},1800);};return;}
 m.innerHTML=`<div class="pad" style="padding-bottom:6px"><div class="h1">Inbox</div></div>${S.convos.map(c=>{const p=P[c.person],l=c.listing&&LST(c.listing);return `<button class="conv" data-id="${c.id}">${avatar(p.av,48)}<div class="t"><b>${esc(p.name)} <span style="display:inline;font-weight:600;color:var(--muted);font-size:12px">· ${p.role==='student'?'Roommate':ROLE[p.role]}</span></b>${l?`<span style="color:var(--b700);font-weight:600">${money(l.price)}/mo · ${esc(l.address.split(',')[0])}</span>`:''}<span>${esc(c.msgs[c.msgs.length-1].t)}</span></div>${c.unread?`<span style="background:var(--b600);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center">${c.unread}</span>`:''}</button>`;}).join('')}`;
 $$('.conv').forEach(b=>b.onclick=()=>{S.openConvo=b.dataset.id;renderInbox();});}

/* ============ SAVED ============ */
function renderSaved(){const H=LISTINGS.filter(l=>S.saved.has(l.id)),R=[...S.rmLiked].map(id=>P[id]);
 $('#main').innerHTML=`<div class="pad"><div class="h1">Saved</div><p class="lead">Homes you hearted and people you said hi to.</p>
  <h4 style="margin:6px 0 10px">Homes (${H.length})</h4>${H.map(homeCard).join('')||'<p class="lead">Tap ♡ on any listing to save it.</p>'}
  <h4 style="margin:16px 0 10px">Roommates (${R.length})</h4><div style="display:grid;gap:8px">${R.map(p=>personRow(p.id)).join('')||'<p class="lead">Swipe right in Roommates to say hi.</p>'}</div></div>`;
 bindCards($('#main'));$$('#main [data-pid]').forEach(b=>b.onclick=()=>openPerson(b.dataset.pid));}

/* ============ PROFILE ============ */
function renderMe(){const m=S.me;
 const sw=(path,arr)=>`<div class="swatches">${arr.map(c=>`<button class="swatch ${getP(path)===c?'on':''}" style="background:${c}" data-p="${path}" data-v='${JSON.stringify(c)}'></button>`).join('')}</div>`;
 $('#main').innerHTML=`<div class="pad">
  <div class="me-card"><div class="row" style="gap:14px">${meAv(80)}<div><div class="h1" style="font-size:20px;margin:0">${esc(m.name)}, ${m.age}</div><div style="font-size:13px;color:var(--muted)">${school().short} · ${esc(m.prog)}</div></div></div>
   <button class="btn ghost sm block" id="prev" style="margin-top:12px">👀 Preview my roommate card</button></div>
  <div class="me-card"><h4>Photo / avatar</h4><p class="sub">Shown on your roommate card.</p>
   <div class="hairs">${HAIRS.map(h=>`<button class="${m.av.h===h?'on':''}" data-p="me.av.h" data-v='"${h}"'>${avatar({...m.av,h,b:false,g:false},42)}</button>`).join('')}</div>
   <div class="fp-h">Skin tone</div>${sw('me.av.s',SK)}<div class="fp-h">Hair color</div>${sw('me.av.hc',HC)}<div class="fp-h">Top</div>${sw('me.av.sh',SH)}
   <div class="opts"><button class="opt ${m.av.g?'on':''}" data-p="me.av.g" data-b="1">👓 Glasses</button><button class="opt ${m.av.b?'on':''}" data-p="me.av.b" data-b="1">🧔 Beard</button></div>
   <label class="btn ghost sm" style="cursor:pointer">📷 Upload a photo<input type="file" accept="image/*" id="photoIn" style="display:none"></label></div>
  <div class="me-card"><h4>About you</h4>
   <div class="two"><div class="field"><label>Name</label><input data-in="me.name" value="${esc(m.name)}"></div><div class="field"><label>Age</label><input type="number" data-in="me.age" data-num="1" value="${m.age}"></div></div>
   <div class="two"><div class="field"><label>Pronouns</label><select data-in="me.pr">${['she/her','he/him','they/them'].map(x=>`<option ${m.pr===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>School</label><select data-in="me.school">${Object.entries(SCHOOLS).map(([k,s])=>`<option value="${k}" ${m.school===k?'selected':''}>${s.short}</option>`).join('')}</select></div></div>
   <div class="field"><label>Year & program</label><input data-in="me.prog" value="${esc(m.prog)}"></div><div class="field"><label>Bio</label><textarea data-in="me.bio" rows="3">${esc(m.bio)}</textarea></div>
   <div class="fp-h">Interests</div><div class="opts">${INTERESTS.map(t=>mopt('me.tags',t,t)).join('')}</div></div>
  <div class="me-card"><h4>Roommate preferences</h4><p class="sub">Used to show what you have in common with people.</p>
   <div class="fp-h">My situation</div><div class="opts" style="display:grid">${opt('me.sit','room','🛏️ I need a room')}${opt('me.sit','together','🔎 I want roommates to search with')}${opt('me.sit','has','🏠 I have a place and need roommates')}</div>
   <div class="fp-h">Who's moving?</div><div class="opts">${[1,2,3].map(n=>opt('me.group',n,['','Just me','Me + 1 friend','Me + 2 friends'][n])).join('')}</div>
   <div class="fp-h">Move-in · ${mvLabel(m.mv)}</div>${mvPicker('me.mv',false)}
   <div class="fp-h">Max budget</div><div class="range-row"><span></span><span data-out="me.maxBudget">${money(m.maxBudget)}</span></div><input type="range" min="700" max="3000" step="50" value="${m.maxBudget}" data-rp="me.maxBudget">
   <div class="fp-h">Schedule</div><div class="opts">${opt('me.sleep','early','☀️ Early bird')}${opt('me.sleep','night','🌙 Night owl')}</div>
   <div class="fp-h">Cleanliness</div><div class="opts">${opt('me.clean',1,'Relaxed')}${opt('me.clean',2,'Tidy')}${opt('me.clean',3,'Very tidy')}</div>
   <div class="fp-h">Home vibe</div><div class="opts">${opt('me.social','quiet','🤫 Quiet')}${opt('me.social','balanced','⚖️ Balanced')}${opt('me.social','social','🎉 Social')}</div>
   <div class="fp-h">Guests over</div><div class="opts">${['Rarely','Sometimes','Often'].map(x=>opt('me.guests',x,x)).join('')}</div>
   ${chk('me.pets','I\'m fine living with pets')}${chk('me.smoke','I smoke')}</div></div>`;
 const main=$('#main');main.onclick=e=>{if(e.target.closest('#photoIn'))return;handleOpt(e,()=>render(true));};
 $$('[data-in]').forEach(i=>i.onchange=()=>{setP(i.dataset.in,i.dataset.num?+i.value:i.value);render(true);});
 $$('[data-rp]').forEach(i=>i.oninput=()=>{setP(i.dataset.rp,+i.value);$(`[data-out="${i.dataset.rp}"]`).textContent=money(+i.value);});
 $('#photoIn').onchange=e=>{const f=e.target.files[0];if(f){S.me.photo=URL.createObjectURL(f);render(true);}};
 $('#prev').onclick=e=>{e.stopPropagation();const p={...m,id:'preview',moveIn:mvLabel(m.mv),budget:[Math.min(1000,m.maxBudget),m.maxBudget],spots:1,role:'student'};
  openSheet(`<div class="sec" style="padding-top:20px"><div class="h1">Your roommate card</div><p class="lead">This is what other students see when they swipe.</p><div style="position:relative;height:470px">${rmCard(p,0,meAv(180))}</div></div>`);};
}
render();
</script>
</body>
</html>
